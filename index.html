<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeus Universal Streaming Player Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>

    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #181818;
            --accent-color: #E50914; /* Netflix Red */
            --text-color: #FFFFFF;
            --text-muted: #AAAAAA;
            --grid-item-width: 220px;
        }

        /* HARDCORE ANTI-COPY & SELECTION PROTECTIONS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ANTI-SCREENSHOT PRINT PROTECTION */
        @media print {
            body, html, #player-view, .main-container {
                display: none !important;
                visibility: hidden !important;
            }
        }

        /* --- HEADER SECTION --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
            position: sticky;
            top: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }

        .logo {
            color: var(--accent-color);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .search-settings-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            color: #fff;
            padding: 8px 15px 8px 35px;
            border-radius: 4px;
            outline: none;
            width: 200px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            width: 260px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 5px;
        }

        .icon-btn:hover {
            color: var(--accent-color);
        }

        /* --- GRID CONTAINER --- */
        .main-container {
            padding: 0 4% 40px 4%;
        }

        .grid-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-title i {
            color: var(--accent-color);
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-item-width), 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .channel-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            aspect-ratio: 16/10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid #222;
        }

        .channel-card:hover, .channel-card:focus {
            transform: scale(1.05);
            box-shadow: 0px 10px 20px rgba(0,0,0,0.8);
            border-color: var(--accent-color);
            outline: none;
        }

        .channel-thumb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        /* TEXT PLACEHOLDER LOGO (ANTI-LAG) */
        .channel-text-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #222 0%, #050505 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            border-bottom: 2px solid rgba(229, 9, 20, 0.1);
        }

        .channel-card:hover .channel-thumb, .channel-card:focus .channel-thumb {
            opacity: 0.8;
        }

        .channel-info {
            position: relative;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 100%);
            width: 100%;
            z-index: 3;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stream-count-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.85);
            color: var(--accent-color);
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid rgba(229, 9, 20, 0.4);
            z-index: 5;
        }

        /* --- RECENTLY PLAYED ROW --- */
        .recent-section {
            display: none; 
            margin-bottom: 20px;
        }

        /* --- STREAM CHOICE PRE-PLAY MODAL OVERLAY --- */
        .stream-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 150;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .stream-modal-content {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        .stream-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }

        .stream-modal-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stream-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .stream-modal-close:hover {
            color: var(--accent-color);
        }

        .stream-option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .stream-option-list::-webkit-scrollbar {
            width: 6px;
        }
        .stream-option-list::-webkit-scrollbar-thumb {
            background-color: #333;
            border-radius: 3px;
        }

        .stream-option-item {
            background-color: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stream-option-item:hover, .stream-option-item:focus {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            outline: none;
            transform: translateX(4px);
        }

        .stream-option-item i {
            opacity: 0.6;
            font-size: 12px;
        }

        /* --- PLAYER VIEW --- */
        .player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .player-container.hide-interface {
            cursor: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Overlay Control Top Bar */
        .player-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 104;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .player-container.hide-interface .player-top-bar {
            transform: translateY(-100%);
            opacity: 0;
        }

        .back-to-grid-btn {
            background-color: rgba(0,0,0,0.6);
            border: 1px solid #333;
            color: #fff;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, border-color 0.2s;
        }

        .back-to-grid-btn:hover, .back-to-grid-btn:focus {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            outline: none;
        }

        .player-right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Stream Switcher Styling inside Player Controls */
        .stream-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .stream-selector-wrapper label {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .stream-select {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            max-width: 240px;
        }

        .stream-select:focus {
            border-color: var(--accent-color);
        }

        .player-controls-hint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.8);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            color: var(--text-muted);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            gap: 20px;
            z-index: 103;
            white-space: nowrap;
            border: 1px solid #222;
        }

        .player-container:hover:not(.hide-interface) .player-controls-hint {
            opacity: 1;
        }

        /* --- SETTINGS MODAL --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            border: 1px solid #333;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        .setting-item {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .setting-item select, .setting-item input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .setting-item input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            height: 6px;
            border: none;
            border-radius: 3px;
            outline: none;
            padding: 0;
            cursor: pointer;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .setting-row select {
            width: auto;
        }

        /* --- HUD / SPINNER --- */
        .hud-notice {
            position: absolute;
            top: 90px;
            right: 4%;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border-left: 4px solid var(--accent-color);
            z-index: 105;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .spinner {
            position: absolute;
            border: 4px solid rgba(255,255,255,0.1);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border-left-color: var(--accent-color);
            animation: spin 1s linear infinite;
            display: block; 
            z-index: 102;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- RESPONSIVE QUERIES --- */
        @media (max-width: 600px) {
            header { padding: 15px 4%; }
            .logo { font-size: 22px; }
            .search-box input { width: 130px; padding: 6px 10px 6px 28px; font-size: 12px; }
            .search-box input:focus { width: 160px; }
            .search-box i { left: 10px; font-size: 12px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(calc(var(--grid-item-width) * 0.75), 1fr)); gap: 12px; }
            .channel-info { padding: 10px; }
            .channel-name { font-size: 12px; }
            .grid-title { font-size: 18px; margin-bottom: 12px; }
            .player-controls-hint { display: none; }
            .hud-notice { top: 75px; font-size: 14px; }
            .back-to-grid-btn { padding: 8px 12px; font-size: 13px; }
            .stream-selector-wrapper { padding: 3px 6px; gap: 4px; }
            .stream-selector-wrapper label { display: none; }
            .stream-select { font-size: 11px; padding: 3px 6px; max-width: 130px; }
            .stream-modal-content { padding: 15px; }
            .stream-option-item { padding: 12px 14px; font-size: 13px; }
        }

        @media (min-width: 1400px) {
            header { padding: 30px 4%; }
            .logo { font-size: 36px; }
            .search-box input { width: 300px; padding: 12px 20px 12px 45px; font-size: 18px; }
            .search-box input:focus { width: 400px; }
            .search-box i { left: 18px; font-size: 18px; }
            .icon-btn { font-size: 28px; }
            .grid-title { font-size: 28px; margin-bottom: 25px; }
            .channel-name { font-size: 18px; }
            .back-to-grid-btn { padding: 14px 24px; font-size: 18px; border-radius: 6px; }
            .player-controls-hint { font-size: 16px; padding: 15px 30px; bottom: 40px; }
            .modal-content { max-width: 600px; padding: 40px; }
        }
    </style>
</head>
<body>

    <header id="app-header">
        <div class="logo"><i class="fa-solid fa-play"></i> ZEUS TV</div>
        <div class="search-settings-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search channels..." autocomplete="new-password" spellcheck="false">
            </div>
            <button class="icon-btn" id="settings-open-btn" aria-label="Open Settings"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <div class="main-container" id="grid-container">
        
        <div class="recent-section" id="recent-section">
            <h2 class="grid-title"><i class="fa-solid fa-clock-rotate-left"></i> Continue Watching</h2>
            <div class="channels-grid" id="recent-grid"></div>
        </div>

        <h2 class="grid-title"><i class="fa-solid fa-layer-group"></i> All Channels</h2>
        <div class="channels-grid" id="channels-grid"></div>
    </div>

    <div class="stream-modal" id="stream-choice-modal">
        <div class="stream-modal-content">
            <div class="stream-modal-header">
                <div class="stream-modal-title" id="stream-modal-title-text">Select Source Option</div>
                <button class="stream-modal-close" id="stream-modal-close-btn">&times;</button>
            </div>
            <div class="stream-option-list" id="stream-options-container"></div>
        </div>
    </div>

    <div class="player-container" id="player-view">
        
        <div class="player-top-bar" id="player-top-bar">
            <button class="back-to-grid-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i> Back (ESC)</button>
            <div class="player-right-controls">
                <div class="stream-selector-wrapper" id="stream-selector-container" style="display: none;">
                    <label for="player-stream-select"><i class="fa-solid fa-compress"></i> Option:</label>
                    <select id="player-stream-select" class="stream-select"></select>
                </div>
                <button class="back-to-grid-btn" id="pip-btn" title="Picture in Picture"><i class="fa-solid fa-window-restore"></i> PiP</button>
            </div>
        </div>

        <div class="spinner" id="loading-spinner"></div>
        <div class="hud-notice" id="hud-notice"></div>
        
        <video id="video-player" autoplay playsinline></video>
        
        <div class="player-controls-hint">
            <span><b>M:</b> Mute/Unmute</span>
            <span><b>▲/▼:</b> Volume</span>
            <span><b>F:</b> Fullscreen</span>
            <span><b>ESC:</b> Back to Grid</span>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Player Settings</h3>
                <button class="modal-close" id="settings-close-btn">&times;</button>
            </div>
            
            <div class="setting-item">
                <label>M3U Playlist Source URL</label>
                <input type="password" id="m3u-source-input" placeholder="Permanent default source locked (Override only if needed)" autocomplete="new-password">
            </div>

            <div class="setting-item">
                <div style="display: flex; justify-content: space-between;">
                    <label>Grid Card Size</label>
                    <span id="grid-size-val" style="color: var(--accent-color); font-weight: bold; font-size: 13px;">220px</span>
                </div>
                <input type="range" id="grid-size-slider" min="140" max="360" value="220" step="10">
            </div>

            <div class="setting-item setting-row">
                <label>Video Aspect Ratio</label>
                <select id="aspect-ratio-select">
                    <option value="contain">Fit (Contain)</option>
                    <option value="cover">Fill Screen (Zoom)</option>
                    <option value="fill">Stretch (Fill)</option>
                </select>
            </div>
            
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button id="save-settings-btn" style="flex:1; background: var(--accent-color); border:none; padding:12px; color:#fff; cursor:pointer; border-radius:4px; font-weight: bold; font-size: 14px;">Save & Close</button>
            </div>
        </div>
    </div>

    <script>
        // PERMANENT FIXED HARDCODED LINK AS ABSOLUTE SYSTEM DEFAULT
        const DEFAULT_M3U_URL = "https://raw.githubusercontent.com/kupsbabaero-ux/playlist/refs/heads/main/Zeus%20Channels%202%20(ONPROGRESS).m3u";
        const PROXY_CORS = "https://robwu.nl/cors-anywhere.html";

        function getPlaylistUrl() {
            const stored = localStorage.getItem('zeus_m3u_url');
            if (stored && stored.trim() !== "") return stored.trim();
            return DEFAULT_M3U_URL;
        }
        
        let CURRENT_M3U_URL = getPlaylistUrl();
        
        const channelsGrid = document.getElementById('channels-grid');
        const recentGrid = document.getElementById('recent-grid');
        const recentSection = document.getElementById('recent-section');
        const searchInput = document.getElementById('search-input');
        const playerView = document.getElementById('player-view');
        const videoPlayer = document.getElementById('video-player');
        const backBtn = document.getElementById('back-btn');
        const pipBtn = document.getElementById('pip-btn');
        const spinner = document.getElementById('loading-spinner');
        const hudNotice = document.getElementById('hud-notice');
        
        const settingsModal = document.getElementById('settings-modal');
        const settingsOpenBtn = document.getElementById('settings-open-btn');
        const settingsCloseBtn = document.getElementById('settings-close-btn');
        const m3uSourceInput = document.getElementById('m3u-source-input');
        const aspectRatioSelect = document.getElementById('aspect-ratio-select');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const gridSizeSlider = document.getElementById('grid-size-slider');
        const gridSizeVal = document.getElementById('grid-size-val');
        
        const streamSelectorContainer = document.getElementById('stream-selector-container');
        const playerStreamSelect = document.getElementById('player-stream-select');

        const streamChoiceModal = document.getElementById('stream-choice-modal');
        const streamModalTitleText = document.getElementById('stream-modal-title-text');
        const streamOptionsContainer = document.getElementById('stream-options-container');
        const streamModalCloseBtn = document.getElementById('stream-modal-close-btn');

        let allChannels = []; 
        let recentChannels = [];
        
        try {
            const rawRecent = localStorage.getItem('zeus_recent_channels');
            if (rawRecent) recentChannels = JSON.parse(rawRecent);
            if (!Array.isArray(recentChannels)) recentChannels = [];
        } catch(e) {
            recentChannels = [];
        }

        let hlsEngine = null;
        let dashEngine = null;
        let controlsTimeout = null;
        let activeChannelData = null; 

        const savedGridSize = localStorage.getItem('zeus_grid_size');
        if (savedGridSize) {
            document.documentElement.style.setProperty('--grid-item-width', `${savedGridSize}px`);
            gridSizeSlider.value = savedGridSize;
            gridSizeVal.innerText = `${savedGridSize}px`;
        }

        // --- PRODUCTION SECURITY ENGINE: BLOCK INSPECT TOOLS & DISALLOW DRAG/KEY EVENTS ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        // LIVE RESILIENT ADVANCED VIDEO LISTENERS (LOADING ENGINE & FREEZE DETECTOR)
        videoPlayer.addEventListener('loadstart', () => { spinner.style.display = 'block'; });
        videoPlayer.addEventListener('waiting', () => { spinner.style.display = 'block'; });
        videoPlayer.addEventListener('seeking', () => { spinner.style.display = 'block'; });
        videoPlayer.addEventListener('playing', () => { spinner.style.display = 'none'; });
        videoPlayer.addEventListener('canplay', () => { spinner.style.display = 'none'; });
        videoPlayer.addEventListener('stalled', () => { spinner.style.display = 'block'; });

        // OFFLINE & ONLINE LIVE DETECTION NETWORK HOOKS
        window.addEventListener('offline', () => {
            showHUD("Network disconnected. Please check your internet connection.");
        });
        window.addEventListener('online', () => {
            showHUD("Network reconnected. Restoring playback...");
            if (activeChannelData) {
                const selectVal = playerStreamSelect.style.display !== 'none' ? parseInt(playerStreamSelect.value) : 0;
                playChannel(activeChannelData, selectVal);
            }
        });

        // UNIVERSAL FULLSCREEN ENGINE LAYER (FOR ANDROID, ANDROID TV, IPAD, IPHONE)
        function toggleUniversalFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (playerView.requestFullscreen) {
                    playerView.requestFullscreen().catch(err => console.log(err));
                } else if (playerView.webkitRequestFullscreen) {
                    playerView.webkitRequestFullscreen();
                } else if (videoPlayer.webkitEnterFullscreen) {
                    videoPlayer.webkitEnterFullscreen(); // Direct Native Media Fallback for iPhone
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // FETCH & PARSE PLAYLIST DIRECT INJECTION + CORS PROXY ENGINE INTELLIGENCE
        async function fetchWithCORSFallback(url) {
            try {
                const response = await fetch(url, { mode: 'cors' });
                if (response.ok) return await response.text();
            } catch (e) {
                console.warn("Direct fetch failed, testing with user CORS proxy...", e);
            }

            try {
                // Pinapasa sa pinrovide mong proxy logic kapag nag-error ang open web origin
                const response = await fetch(PROXY_CORS + url);
                if (response.ok) return await response.text();
            } catch(e) {
                console.warn("User proxy failed, trying AllOrigins backup pool...", e);
            }

            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            const proxyResponse = await fetch(proxyUrl);
            if (!proxyResponse.ok) throw new Error("Proxy fetch also failed.");
            const json = await proxyResponse.json();
            return json.contents;
        }

        async function loadPlaylist() {
            try {
                m3uSourceInput.value = localStorage.getItem('zeus_m3u_url') || "";
                const data = await fetchWithCORSFallback(CURRENT_M3U_URL);
                allChannels = parseM3UAndGroup(data);
                renderChannels(allChannels, channelsGrid);
                renderRecentChannels();
            } catch (error) {
                console.error("Playlist Error:", error);
                channelsGrid.innerHTML = `<p style="padding: 20px; color: var(--accent-color)">Error loading your playlist securely. Check your network connection.</p>`;
            }
        }

        // ULTRA-ROBUST PARSER LOGIC TO COMPLETELY ELIMINATE UNDEFINED NAMES
        function parseM3UAndGroup(m3uString) {
            const lines = m3uString.split('\n');
            const groupedMap = new Map();
            let currentMeta = {};

            const cleanNameRegex = /(\s+\d+|\s+hd|\s+fhd|\s+sd|\s+backup)/i;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    let logo = logoMatch ? logoMatch[1] : '';

                    let name = "";
                    const nameIndex = line.lastIndexOf(',');
                    
                    if (nameIndex !== -1 && nameIndex < line.length - 1) {
                        name = line.substring(nameIndex + 1).trim();
                    }
                    
                    if (!name) {
                        const tvgNameMatch = line.match(/tvg-name="([^"]+)"/);
                        if (tvgNameMatch) name = tvgNameMatch[1].trim();
                    }
                    
                    if (!name) {
                        const groupTitleMatch = line.match(/group-title="([^"]+)"/);
                        if (groupTitleMatch) name = groupTitleMatch[1].trim();
                    }

                    if (!name) name = "Unknown Channel Option";

                    currentMeta = { name, logo };
                } else if (line.startsWith('http') || line.startsWith('https')) {
                    if (currentMeta.name) {
                        const rawName = currentMeta.name;
                        
                        let clusterName = rawName.replace(cleanNameRegex, '').trim();
                        if (!clusterName) clusterName = rawName;

                        const streamObject = {
                            originalName: rawName,
                            url: line
                        };

                        if (!groupedMap.has(clusterName)) {
                            groupedMap.set(clusterName, {
                                name: clusterName,
                                logo: currentMeta.logo,
                                streams: [streamObject] 
                            });
                        } else {
                            groupedMap.get(clusterName).streams.push(streamObject);
                            if (!groupedMap.get(clusterName).logo && currentMeta.logo) {
                                groupedMap.get(clusterName).logo = currentMeta.logo;
                            }
                        }
                    }
                    currentMeta = {};
                }
            }
            return Array.from(groupedMap.values());
        }

        function renderChannels(channels, targetGrid) {
            targetGrid.innerHTML = '';
            if (channels.length === 0) {
                targetGrid.innerHTML = `<p style="padding: 20px; color: var(--text-muted)">No channels found.</p>`;
                return;
            }
            channels.forEach(channel => {
                if (!channel.streams || channel.streams.length === 0) return;
                
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.tabIndex = 0;
                
                const badgeHTML = channel.streams.length > 1 ? `<div class="stream-count-badge">${channel.streams.length} OPTIONS</div>` : '';
                const firstLetter = channel.name.charAt(0);

                let visualLogoHTML = `<div class="channel-text-placeholder">${firstLetter}</div>`;
                if (channel.logo && channel.logo.trim() !== "") {
                    visualLogoHTML = `<img class="channel-thumb" src="${channel.logo}" loading="lazy" onerror="this.style.display='none'">`;
                }

                card.innerHTML = `
                    ${badgeHTML}
                    ${visualLogoHTML}
                    <div class="channel-info"><div class="channel-name">${channel.name}</div></div>
                `;
                
                const triggerClickAction = () => {
                    if (channel.streams.length > 1) {
                        showStreamChoiceModal(channel);
                    } else {
                        addToRecent(channel);
                        playChannel(channel, 0); 
                    }
                };

                card.addEventListener('click', triggerClickAction);
                card.addEventListener('keydown', (e) => { if (e.key === 'Enter') triggerClickAction(); });
                targetGrid.appendChild(card);
            });
        }

        function showStreamChoiceModal(channel) {
            streamModalTitleText.innerText = `Select Stream for: ${channel.name}`;
            streamOptionsContainer.innerHTML = '';
            
            channel.streams.forEach((strm, idx) => {
                const btn = document.createElement('button');
                btn.className = 'stream-option-item';
                btn.innerHTML = `<span>${strm.originalName}</span> <i class="fa-solid fa-chevron-right"></i>`;
                
                btn.onclick = () => {
                    streamChoiceModal.style.display = 'none';
                    addToRecent(channel);
                    playChannel(channel, idx);
                };
                streamOptionsContainer.appendChild(btn);
            });
            
            streamChoiceModal.style.display = 'flex';
        }

        streamModalCloseBtn.onclick = () => {
            streamChoiceModal.style.display = 'none';
        };
        
        streamChoiceModal.onclick = (e) => {
            if (e.target === streamChoiceModal) streamChoiceModal.style.display = 'none';
        };

        function renderRecentChannels() {
            if (recentChannels.length === 0) {
                recentSection.style.display = 'none';
                return;
            }
            recentSection.style.display = 'block';
            renderChannels(recentChannels, recentGrid);
        }

        function addToRecent(channel) {
            recentChannels = recentChannels.filter(c => c.name !== channel.name);
            recentChannels.unshift(channel);
            if (recentChannels.length > 5) recentChannels.pop();
            localStorage.setItem('zeus_recent_channels', JSON.stringify(recentChannels));
            renderRecentChannels();
        }

        // UNIVERSAL PLAY ENGINE WITH SEAMLESS STREAM SELECTOR INITIATION & PROXY DELEGATION
        function playChannel(channel, streamIndex = 0) {
            if (!navigator.onLine) {
                showHUD("Network disconnected. Please check your internet connection.");
                return;
            }

            playerView.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            spinner.style.display = 'block'; 
            activeChannelData = channel; 

            resetCorePlayers();
            
            const streamData = channel.streams[streamIndex];
            if (!streamData) {
                spinner.style.display = 'none';
                showHUD("Error: Stream source unavailable");
                return;
            }
            
            // Pwede nating gamitin ang proxy para i-rewrite ang direct link para i-bypass ang CORS
            let streamUrl = streamData.url;
            
            // AUTOMATIC INJECT TO CORE: Kung alam nating galing ito sa isang open public .m3u8 setup, unblock natively
            if (streamUrl.includes('cignal') || streamUrl.includes('live') || streamUrl.includes('iptv')) {
                 console.log("Applying stream routing mechanism over CORS constraints.");
                 // Kung gusto mong puwersahin ang lahat ng streams sa proxy, i-uncomment ang linya sa ibaba:
                 // streamUrl = PROXY_CORS + streamUrl;
            }
            
            const urlLower = streamUrl.toLowerCase();

            if (channel.streams.length > 1) {
                playerStreamSelect.innerHTML = '';
                channel.streams.forEach((strm, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.text = strm.originalName; 
                    if (idx === streamIndex) opt.selected = true;
                    playerStreamSelect.appendChild(opt);
                });
                streamSelectorContainer.style.display = 'flex';
            } else {
                streamSelectorContainer.style.display = 'none';
            }

            // 1. DASH ENGINE (.mpd)
            if (urlLower.includes('.mpd') || urlLower.includes('dash')) {
                dashEngine = dashjs.MediaPlayer().create();
                dashEngine.updateSettings({
                    'streaming': {
                        'fastSwitchEnabled': true,
                        'buffer': { 'stableBufferTime': 2, 'bufferTimeAtTopQuality': 4, 'bufferTimeAtTopQualityLongForm': 4 },
                        'abr': { 'initialBitrate': {'audio': -1, 'video': 1000} }
                    }
                });
                dashEngine.initialize(videoPlayer, streamUrl, true);
            } 
            // 2. ULTRA-LOW LATENCY HLS ENGINE (.m3u8, .ts)
            else if (urlLower.includes('.m3u8') || urlLower.includes('.ts') || Hls.isSupported()) {
                if (Hls.isSupported()) {
                    hlsEngine = new Hls({ 
                        maxLength: 0, maxBufferLength: 4, maxMaxBufferLength: 8,
                        enableWorker: true, lowLatencyMode: true, liveSyncDuration: 1.5, backBufferLength: 0,
                        // Pinapayagan nito ang hls.js engine na sumunod kapag kailangan mag-request ng proxy cookies/headers
                        xhrSetup: function(xhr, url) {
                            // Kung direct link at nagkaproblema, pwedeng baguhin dito ang xhr execution architecture
                        }
                    });
                    hlsEngine.loadSource(streamUrl);
                    hlsEngine.attachMedia(videoPlayer);
                    hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoPlayer.play().catch(() => {});
                    });
                } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    videoPlayer.src = streamUrl;
                    videoPlayer.addEventListener('loadedmetadata', () => {
                        videoPlayer.play().catch(() => {});
                    });
                }
            } 
            // 3. STANDARD DIRECT MP4 / RAW CORE MEDIA
            else {
                videoPlayer.src = streamUrl;
                videoPlayer.load();
                videoPlayer.play().catch(() => {});
            }

            showHUD(`Playing: ${streamData.originalName}`);
            resetControlTimeout();
        }

        playerStreamSelect.addEventListener('change', (e) => {
            if (activeChannelData) {
                const targetIdx = parseInt(e.target.value);
                playChannel(activeChannelData, targetIdx);
            }
        });

        function resetCorePlayers() {
            videoPlayer.pause();
            if (hlsEngine) { hlsEngine.destroy(); hlsEngine = null; }
            if (dashEngine) { dashEngine.reset(); dashEngine = null; }
            videoPlayer.src = "";
            videoPlayer.removeAttribute('src');
        }

        function closePlayer() {
            playerView.style.display = 'none';
            document.body.style.overflow = 'auto';
            playerView.classList.remove('hide-interface');
            clearTimeout(controlsTimeout);
            activeChannelData = null;
            resetCorePlayers();
        }

        function resetControlTimeout() {
            playerView.classList.remove('hide-interface');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (playerView.style.display === 'flex') {
                    playerView.classList.add('hide-interface');
                }
            }, 3000);
        }

        playerView.addEventListener('mousemove', resetControlTimeout);
        playerView.addEventListener('touchstart', resetControlTimeout);

        // HOTKEYS MANAGEMENT WITH REVOLUTIONARY FULLSCREEN LAYERING
        window.addEventListener('keydown', (e) => {
            if (playerView.style.display === 'flex') {
                if (e.key === 'Escape' || e.key === 'Back' || e.keyCode === 461) {
                    e.preventDefault(); 
                    closePlayer(); 
                }
                if (e.key === 'm' || e.key === 'M') {
                    videoPlayer.muted = !videoPlayer.muted;
                    showHUD(videoPlayer.muted ? "Muted" : `Volume: ${Math.round(videoPlayer.volume * 100)}%`);
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.05);
                    videoPlayer.muted = false;
                    showHUD(`Volume: ${Math.round(videoPlayer.volume * 100)}%`);
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.05);
                    showHUD(`Volume: ${Math.round(videoPlayer.volume * 100)}%`);
                }
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    toggleUniversalFullscreen();
                }
            } else if (streamChoiceModal.style.display === 'flex') {
                if (e.key === 'Escape') {
                    streamChoiceModal.style.display = 'none';
                }
            }
        });

        pipBtn.addEventListener('click', async () => {
            try {
                if (videoPlayer !== document.pictureInPictureElement) {
                    await videoPlayer.requestPictureInPicture();
                } else {
                    await document.exitPictureInPicture();
                }
            } catch (error) {
                console.error("PiP Error: ", error);
            }
        });

        let hudTimeout;
        function showHUD(text) {
            hudNotice.innerText = text;
            hudNotice.style.opacity = '1';
            clearTimeout(hudTimeout);
            hudTimeout = setTimeout(() => hudNotice.style.opacity = '0', 3000); 
        }

        // SEARCH BAR FILTER
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered, channelsGrid);
        });

        // SLIDER CONTROL
        gridSizeSlider.addEventListener('input', (e) => {
            const currentSize = e.target.value;
            gridSizeVal.innerText = `${currentSize}px`;
            document.documentElement.style.setProperty('--grid-item-width', `${currentSize}px`);
            localStorage.setItem('zeus_grid_size', currentSize);
        });

        // SETTINGS CONTROL
        settingsOpenBtn.onclick = () => settingsModal.style.display = 'flex';
        settingsCloseBtn.onclick = () => settingsModal.style.display = 'none';
        window.onclick = (e) => { if (e.target == settingsModal) settingsModal.style.display = 'none'; }
        
        aspectRatioSelect.onchange = (e) => videoPlayer.style.objectFit = e.target.value;
        
        saveSettingsBtn.onclick = () => {
            const newUrl = m3uSourceInput.value.trim();
            if (newUrl !== "") {
                localStorage.setItem('zeus_m3u_url', newUrl);
                CURRENT_M3U_URL = newUrl;
            } else {
                localStorage.removeItem('zeus_m3u_url');
                CURRENT_M3U_URL = DEFAULT_M3U_URL;
            }
            loadPlaylist();
            settingsModal.style.display = 'none';
            showHUD("Settings Secured & Saved!");
        };

        backBtn.addEventListener('click', closePlayer);

        // STARTUP LOAD EXECUTION
        loadPlaylist();

        (function() {
            'use strict';

            const warningBanner = document.getElementById('extension-warning');

            function triggerWarning() {
                if (warningBanner) {
                    warningBanner.style.display = 'block';
                }
            }

            // ==========================================
            // 1. DOM SHIELD: Monitor & Kill Injected Nodes
            // ==========================================
            const observerTarget = document.documentElement || document.body;
            
            const domObserver = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        // Check for node elements only (ignore text fragments)
                        if (node.nodeType === Node.ELEMENT_NODE) {
                            const nodeName = node.nodeName.toLowerCase();
                            const nodeId = node.id ? node.id.toLowerCase() : '';
                            const nodeClass = node.className && typeof node.className === 'string' ? node.className.toLowerCase() : '';

                            // List of known aggressive extension tags, classes, or IDs
                            if (
                                nodeName.includes('grammarly') || 
                                nodeName.includes('ext') ||
                                nodeId.includes('adblock') || 
                                nodeClass.includes('ad-blocker')
                            ) {
                                console.warn(`[Shield] Extension node detected & destroyed: <${nodeName}>`);
                                triggerWarning();
                                node.remove(); // Evict it from the DOM immediately
                            }
                        }
                    });
                });
            });

            // Start monitoring the entire document structure
            domObserver.observe(observerTarget, {
                childList: true,
                subtree: true
            });

            // ==========================================
            // 2. RESOURCE CHECK: Catch Ad-Blocker Interference
            // ==========================================
            window.addEventListener('load', () => {
                // Check if a vital script variable didn't load due to a blocker 
                // (e.g., if you have a crucial script or monetization check)
                if (window.adBlockerActive === true || typeof window.someRequiredGlobal === 'undefined') {
                    // Simulating a minor check failure here.
                    // If you expect a resource to be there and it's missing, drop a warning.
                    console.log("[Shield] Resource check processed.");
                }
            });

        })();
    </script>
